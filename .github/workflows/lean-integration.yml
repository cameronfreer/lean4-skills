name: lean-integration

# Real-toolchain integration suite for the file-gate / /disprove certification
# sequence (#166, PR #195): one Linux job, one pinned Lean toolchain (the
# fixture's lean-toolchain), no mathlib, no LSP; plus a second job that reruns
# only the core reference snippets on a newer Lean. Separate from lint.yml so the
# fast contract suites stay fast; the toolchain is cached, the fixture
# projects' .lake directories are never cached (their state is the experiment).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lean-file-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The transaction helper's floor (stdlib tomllib in /disprove).
          python-version: "3.11"

      - name: Read the fixture's pinned toolchain
        id: toolchain
        run: |
          tc=$(cat plugins/lean4/tests/fixtures/lean_file_gate/lean-toolchain)
          echo "name=$tc" >> "$GITHUB_OUTPUT"
          echo "pinned toolchain: $tc"

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ steps.toolchain.outputs.name }}

      - name: Install elan + the pinned toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "${{ steps.toolchain.outputs.name }}"

      - name: Verify the toolchain actually used (fail loudly if absent)
        working-directory: plugins/lean4/tests/fixtures/lean_file_gate
        run: |
          set -euo pipefail
          lean --version
          lake --version
          v="${{ steps.toolchain.outputs.name }}"; v="${v##*:v}"
          lean --version | grep -F "$v"

      - name: Lean/Lake file-gate integration suite
        env:
          # On failure the suite exports each failing project (sources, .lake
          # artifacts, and a COMMANDS.log transcript) here; uploaded below so
          # the evidence outlives the runner.
          LEAN_FILE_GATE_KEEP_DIR: ${{ runner.temp }}/lean_file_gate_failures
        run: python3 plugins/lean4/tests/integration/test_lean_file_gate.py -v

      - name: Core-Lean reference snippets (instance registration; #167/#168/#169 diagnostics; #181 grind/metaprogramming/linter/Verso/profiler)
        # Same pinned toolchain, no Mathlib. Documented repairs must elaborate;
        # documented failures are #guard_msgs controls, plus one must-fail file
        # for the `omit` parse error that #guard_msgs cannot capture.
        working-directory: plugins/lean4/tests/fixtures/lean_file_gate
        run: bash ../reference_snippets/run_core_snippets.sh

      - name: Upload failing projects + command transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-file-gate-failures
          path: ${{ runner.temp }}/lean_file_gate_failures
          # v4 excludes dotfiles/dirs by default; the exported project's
          # `.lake/` (its .olean artifact state) is the evidence this upload
          # exists to keep. Path stays restricted to the failure directory.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # The core-Lean reference snippets again, on a toolchain newer than the
  # fixture's pin: catches version-specific regressions in the documented
  # examples and runs the version-gated fixtures the pinned job skips
  # (grind_bv_snippets.lean needs v4.34.0+). Pinned rather than floating, so a
  # Lean release never turns CI red by itself; bump NEWER_LEAN deliberately.
  # The file-gate suite stays on the fixture's pin only.
  core-snippets-newer-lean:
    runs-on: ubuntu-latest
    env:
      NEWER_LEAN: leanprover/lean4:v4.35.0
    steps:
      - uses: actions/checkout@v5

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ env.NEWER_LEAN }}

      - name: Install elan + the newer toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$NEWER_LEAN"

      - name: Core-Lean reference snippets on the newer toolchain
        # Same directory and runner as the pinned job; ELAN_TOOLCHAIN overrides
        # the directory's lean-toolchain for `lean` and for `elan which lean`.
        working-directory: plugins/lean4/tests/fixtures/lean_file_gate
        env:
          ELAN_TOOLCHAIN: ${{ env.NEWER_LEAN }}
        run: |
          set -euo pipefail
          v="${NEWER_LEAN##*:v}"
          lean --version
          lean --version | grep -F "version $v"
          elan which lean | grep -F "v$v/"
          bash ../reference_snippets/run_core_snippets.sh | tee "$RUNNER_TEMP/snippets.log"
          # The version-gated fixture must have run here, not been skipped.
          grep -F '== grind_bv_snippets.lean (must elaborate' "$RUNNER_TEMP/snippets.log"
